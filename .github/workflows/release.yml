name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compute next version
        id: ver
        shell: pwsh
        run: |
          # 版本累积: 取现存最高 vX.Y.Z tag, patch+1; 无 tag 则从 v3.0.0 起
          $tags = & git tag
          $vers = @($tags | ForEach-Object {
              if ($_ -match '^v(\d+)\.(\d+)\.(\d+)$') {
                  [pscustomobject]@{ Major=[int]$Matches[1]; Minor=[int]$Matches[2]; Patch=[int]$Matches[3] }
              }
          })
          if ($vers.Count -gt 0) {
              $max = $vers | Sort-Object Major, Minor, Patch -Descending | Select-Object -First 1
              $next = "v$($max.Major).$($max.Minor).$($max.Patch + 1)"
          } else {
              $next = "v3.0.0"
          }
          echo "next=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "Detected next version: $next"

      - name: Build full (含缓存版)
        run: python build.py --cli full

      - name: Build lite (精简版)
        run: python build.py --cli lite

      - name: Rename exe to ASCII release names
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.next }}"
          Copy-Item "dist\NB宗_PVE_Batocera部署管理器_含缓存版.exe" "dist\NB_Batocera2PVE-$v-full.exe"
          Copy-Item "dist\NB宗_PVE_Batocera部署管理器_精简版.exe" "dist\NB_Batocera2PVE-$v-lite.exe"
          Get-ChildItem dist | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Package source zip (含缓存)
        shell: bash
        run: |
          bash tools/pack_release.sh zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.next }}
          name: Release ${{ steps.ver.outputs.next }}
          generate_release_notes: true
          files: |
            dist/NB_Batocera2PVE-${{ steps.ver.outputs.next }}-full.exe
            dist/NB_Batocera2PVE-${{ steps.ver.outputs.next }}-lite.exe
            release/*.zip